name: public-safety

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/public-safety-check.sh
      - run: python3 -m unittest discover -s clients/python -p 'test_*.py' -v
      - run: node --test clients/js/*.test.mjs
